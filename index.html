<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포지마스터 스킬 계산기</title>

<style>
body{font-family:Arial;background:#0f0f0f;color:white;padding:30px;}
h1{color:#ffd700;}
.card{background:#1e1e1e;padding:20px;margin-bottom:20px;border-radius:10px;}
select,input{padding:6px;margin:3px;}
.result{font-size:20px;color:#00ffc3;margin-top:10px;}
.stat{color:#ffd700;margin-top:5px;}
table{border-collapse:collapse;width:100%;}
td,th{border:1px solid #444;padding:6px;text-align:center;}
th{background:#333;}
</style>

</head>

<body>

<h1>포지마스터 스킬 계산기</h1>
<p>제작자 : 21서버 Dominant 클랜 리더 Troud (3승천 150레벨 확장 반영)</p>

<div class="card">
<h2>기술 트리 티어 설정</h2>
<div id="tiers"></div>
</div>

<div class="card">
<h2>승천 / 레벨 설정</h2>

현재 승천
<select id="curAsc">
<option>0</option><option>1</option><option>2</option><option>3</option>
</select>

현재 레벨
<input id="curLvl" type="number" min="1" max="150" value="1">
<br><br>

목표 승천
<select id="tarAsc">
<option>0</option><option>1</option><option>2</option><option selected>3</option>
</select>

목표 레벨
<input id="tarLvl" type="number" min="1" max="150" value="150">

</div>

<div class="card">
<h2>계산 결과</h2>

<div class="result" id="summonCount"></div>
<div class="result" id="ticketResult"></div>
<div class="result" id="clanScoreResult"></div>

</div>

<div class="card">
<h2>레벨별 필요 소환 횟수 (1~150)</h2>

<table id="summonTable">
<tr>
<th>레벨</th>
<th>필요 소환 횟수</th>
</tr>
</table>

</div>

<script>

// 🔥 승천별 최대 레벨 반환 함수 (0~2승천: 100레벨, 3승천: 150레벨)
function getMaxLevel(asc){
return asc === 3 ? 150 : 100;
}

// 🔥 소환 횟수 함수
function getSummonCount(lvl){

if(lvl===2) return 5
if(lvl===3) return 10
if(lvl===4) return 15
if(lvl===5) return 20
if(lvl===6) return 25
if(lvl===7) return 30
if(lvl===8) return 35
if(lvl===9) return 40
if(lvl===10) return 45
if(lvl===11) return 50
if(lvl===12) return 60
if(lvl===13) return 70
if(lvl===14) return 80
if(lvl===15) return 90
if(lvl===16) return 100

// 17~100 구간
if(lvl <= 100) return 110

// 101~150 구간 (100레벨 이후부터 레벨당 75씩 증가)
return 110 + (lvl - 100) * 75;
}

// 티어 UI (T1 ~ T6)
function createUI(){

let html="<b>스킬 소환 비용 감소</b><br>"

for(let i=1;i<=6;i++){
html+="T"+i+" <select id='tier"+i+"' onchange='handleTier("+i+")'>"
for(let j=0;j<=5;j++){
html+="<option>"+j+"</option>"
}
html+="</select> "
}

html+="<div class='stat' id='tierStat'></div>"

document.getElementById("tiers").innerHTML=html
}

// 티어 로직 (T1 ~ T6 연동)
function handleTier(t){

let val=Number(document.getElementById("tier"+t).value)

if(val===0){
for(let i=t+1;i<=6;i++){
document.getElementById("tier"+i).value=0
}
}

if(val>=2){
for(let i=1;i<t;i++){
let el=document.getElementById("tier"+i)
if(Number(el.value)===0)el.value=5
}
}

calculate()
}

function getDiscount(){

let sum=0
for(let i=1;i<=6;i++){
sum+=Number(document.getElementById("tier"+i).value)
}

return sum*0.01
}

// 계산
function calculate(){

let discount=getDiscount()

document.getElementById("tierStat").innerText=
"현재 효과 : "+(discount*100).toFixed(1)+"%"

let curAsc=Number(curAscEl.value)
let tarAsc=Number(tarAscEl.value)
let curLvl=Number(curLvlEl.value)
let tarLvl=Number(tarLvlEl.value)

// 입력값 검증: 목표 레벨이 해당 승천의 최대 레벨을 넘지 않도록 제한
let maxCurLvl = getMaxLevel(curAsc);
let maxTarLvl = getMaxLevel(tarAsc);

if(curLvl > maxCurLvl) curLvl = maxCurLvl;
if(tarLvl > maxTarLvl) tarLvl = maxTarLvl;

if(
    curAsc > tarAsc ||
    (curAsc === tarAsc && curLvl > tarLvl)
){
    summonCount.innerText="목표 레벨이 현재보다 낮습니다."
    ticketResult.innerText=""
    clanScoreResult.innerText=""
    return
}
  
let total=0

while(true){

if(curAsc===tarAsc){
for(let i=curLvl+1;i<=tarLvl;i++){
total+=getSummonCount(i)
}
break
}

let maxLvl = getMaxLevel(curAsc);
for(let i=curLvl+1;i<=maxLvl;i++){
total+=getSummonCount(i)
}

curAsc++
curLvl=1
}

let ticket=total*40*(1-discount)
let clanScore=total*225 // 클랜 전쟁 점수 계산 (필요 소환 횟수 * 225)

summonCount.innerText="필요 소환 횟수 : "+total.toLocaleString()
let ticketCeil=Math.ceil(ticket)

// k 단위 변환
let ticketK=(ticketCeil/1000).toFixed(1).replace(/\.0$/,"")

ticketResult.innerText=
"필요 스킬 티켓 : "+ticketCeil.toLocaleString()+" ("+ticketK+"k)"

// 클랜 전쟁 점수 결과 출력
clanScoreResult.innerText=
"클랜 전쟁 소환 점수(클랜 기술 풀업 기준) : "+clanScore.toLocaleString()
}

// 🔥 표 생성 (1~150레벨)
function createTable(){

let html=""

for(let i=1;i<=150;i++){

html+="<tr>"
html+="<td>"+i+"</td>"

// 1레벨은 없음
if(i===1){
html+="<td>-</td>"
}else{
html+="<td>"+getSummonCount(i)+"</td>"
}

html+="</tr>"
}

document.getElementById("summonTable").innerHTML+=html
}

// DOM
const curAscEl=document.getElementById("curAsc")
const tarAscEl=document.getElementById("tarAsc")
const curLvlEl=document.getElementById("curLvl")
const tarLvlEl=document.getElementById("tarLvl")

const summonCount=document.getElementById("summonCount")
const ticketResult=document.getElementById("ticketResult")
const clanScoreResult=document.getElementById("clanScoreResult")

document.querySelectorAll("input,select").forEach(el=>{
el.oninput=calculate
})

createUI()
createTable()
calculate()

</script>

</body>
</html>
